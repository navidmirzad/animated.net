services:
  frontend:
    build:
      context: ./frontend/animated-frontend
      dockerfile: Dockerfile
    container_name: animated-frontend
    ports:
      - "5173:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_API_URL=http://backend:5000
    volumes:
      - ./frontend/animated-frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - animated-network
    restart: unless-stopped

  backend:
    build:
      context: ./animated
      dockerfile: Dockerfile
    container_name: animated-backend
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - DB_SERVER=mariadb
      - DB_PORT=3306
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - animated-network
    restart: unless-stopped

  mariadb:
    image: mariadb:latest
    container_name: animated-mariadb
    ports:
      - "3308:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${DB_NAME}
      - MYSQL_USER=${DB_USER}
      - MYSQL_PASSWORD=${DB_PASSWORD}
    volumes:
      - mariadb-data:/var/lib/mysql
    networks:
      - animated-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      timeout: 20s
      retries: 10

networks:
  animated-network:
    driver: bridge

volumes:
  mariadb-data:
