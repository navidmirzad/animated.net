services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: animated-backend
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=mariadb;Port=3306;Database=animatedDB;User=animateduser;Password=${DB_PASSWORD}
    depends_on:
      - mariadb
    networks:
      - animated-network
    restart: unless-stopped

  mariadb:
    image: mariadb:latest
    container_name: animated-mariadb
    ports:
      - "3308:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=animatedDB
      - MYSQL_USER=animateduser
      - MYSQL_PASSWORD=${DB_PASSWORD}
    volumes:
      - mariadb-data:/var/lib/mysql
    networks:
      - animated-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      timeout: 20s
      retries: 10

networks:
  animated-network:
    driver: bridge

volumes:
  mariadb-data:
